<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>&#9834;</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    height: 100%; margin: 0;
    background: #10131a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #tapzone {
    position: relative;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .stage {
    display: flex; flex-direction: column; align-items: center;
  }

  .btn {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: #4f7cff;
    display: flex; align-items: center; justify-content: center;
    color: white;
    box-shadow: 0 8px 28px rgba(79,124,255,0.4);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .btn svg { width: 42px; height: 42px; }
  #tapzone.pressed .btn { transform: scale(0.92); }

  .reveal {
    display: flex; flex-direction: column; align-items: center;
    max-height: 0; opacity: 0; margin-bottom: 0;
    overflow: hidden;
    transition: max-height 0.45s ease, opacity 0.4s ease, margin-bottom 0.45s ease;
  }
  .reveal.visible { max-height: 55vh; opacity: 1; margin-bottom: 28px; }
  .reveal img { width: min(80vw, 440px); max-height: 38vh; height: auto; }
  .reveal p {
    margin: 14px 0 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #f4f4f4;
  }
</style>
</head>
<body>
  <div id="tapzone">
    <div class="stage">
      <div class="reveal" id="reveal">
        <img src="images/tag3.svg" alt="DO - MI on a musical staff">
        <p>DO &middot; MI</p>
      </div>
      <div class="btn" id="btn">
        <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
        <svg id="icon-eye" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 5c-5.6 0-9.6 4.4-11 7 1.4 2.6 5.4 7 11 7s9.6-4.4 11-7c-1.4-2.6-5.4-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2A2.5 2.5 0 1 0 12 9.5a2.5 2.5 0 0 0 0 5z"/></svg>
        <svg id="icon-next" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M6 18l8.5-6L6 6v12zM16 6v12h2V6h-2z"/></svg>
      </div>
    </div>
  </div>

  <audio id="audio" src="sounds/tag3.mp3" preload="auto"></audio>
  <!-- tag3.mp3 contains the piano notes C4-E4 (DO-MI) -->

  <script>
    const audio = document.getElementById('audio');
    const zone = document.getElementById('tapzone');
    const btn = document.getElementById('btn');
    const iconPlay = document.getElementById('icon-play');
    const iconEye = document.getElementById('icon-eye');
    const iconNext = document.getElementById('icon-next');
    const reveal = document.getElementById('reveal');

    // stage 0 = blind (not played), 1 = played (waiting for reveal tap),
    // 2 = revealed (button is now "next" -> jumps to a random other tag)
    let stage = 0;
    const OTHER_TAGS = [1, 2, 4, 5, 6, 7, 8]; // this tag's number excluded

    function markPlayed() {
      if (stage !== 0) return;
      stage = 1;
      iconPlay.style.display = 'none';
      iconEye.style.display = '';
    }

    // Silent auto-play attempts: only ever advance stage 0 -> 1, never
    // trigger the reveal or navigation. Fire on load and whenever the
    // page regains visibility/focus (e.g. after Android's NFC dialog).
    function attemptAutoPlay() {
      if (stage !== 0) return;
      audio.play().then(markPlayed).catch(() => {});
    }
    attemptAutoPlay();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') attemptAutoPlay();
    });
    window.addEventListener('pageshow', attemptAutoPlay);
    window.addEventListener('focus', attemptAutoPlay);

    function goToRandomTag() {
      const next = OTHER_TAGS[Math.floor(Math.random() * OTHER_TAGS.length)];
      window.location.href = `tag${next}.html`;
    }

    // A real, deliberate tap drives the stage machine:
    // stage 0 -> play blind; stage 1 -> reveal; stage 2 -> jump to a random other tag.
    function handleTap() {
      if (stage === 0) {
        audio.currentTime = 0;
        audio.play().then(markPlayed).catch(() => {});
      } else if (stage === 1) {
        stage = 2;
        reveal.classList.add('visible');
        iconEye.style.display = 'none';
        iconNext.style.display = '';
      } else {
        goToRandomTag();
      }
    }

    zone.addEventListener('pointerdown', () => zone.classList.add('pressed'));
    zone.addEventListener('pointerup', () => zone.classList.remove('pressed'));
    zone.addEventListener('pointercancel', () => zone.classList.remove('pressed'));
    zone.addEventListener('click', handleTap);

    // Space bar also acts as a tap, for testing on desktop.
    document.addEventListener('keydown', (e) => {
      if (e.code === 'Space' || e.key === ' ') {
        e.preventDefault(); // stop the page from scrolling
        handleTap();
      }
    });
  </script>
</body>
</html>
