<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NFC Sound Tags — Demo</title>
<style>
  html, body {
    height: 100%; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: #10131a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    color: #f4f4f4;
  }
  .wrap { text-align: center; padding: 32px; max-width: 420px; }
  h1 { font-size: 1.4rem; margin-bottom: 8px; }
  p.sub { opacity: 0.6; margin-bottom: 32px; font-size: 0.9rem; }
  a.card {

    text-decoration: none;

    padding: 20px;

    border: 1px solid #2a2f3d;

  a.card:active { background: #23283a; }
  .card .name { font-weight: 600; font-size: 1.05rem; }

<body>
  <div class="wrap">
    <h1>NFC Sound Tags</h1>
    <p class="sub">Test pages for programmable NFC tags. Each link below is what a tag should point to.</p>
    <a class="card" href="tag1.html">
      <div class="name">🔔 Tag 1 — Doorbell</div>
      <div class="desc">tag1.html</div>
    </a>
    <a class="card" href="tag2.html">
