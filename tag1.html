<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Doorbell Tag</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    height: 100%; margin: 0;
    background: #10131a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
  }
  /* The entire viewport is the tap target */
  #tapzone {
    height: 100%; width: 100%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
    transition: background 0.15s ease;
  }
  #tapzone.pressed { background: #171c28; }
  .card { text-align: center; padding: 40px 32px; color: #f4f4f4; pointer-events: none; }
  .icon { font-size: 64px; margin-bottom: 8px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 24px; opacity: 0.9; }
  .pill {
    display: inline-block;
    font-size: 1.3rem;
    font-weight: 600;
    padding: 22px 48px;
    border-radius: 999px;
    background: #4f7cff;
    color: white;
    box-shadow: 0 6px 20px rgba(79,124,255,0.4);
    transition: background 0.15s ease, box-shadow 0.15s ease;
  }
  .pill.played { background: #2ecc71; box-shadow: 0 6px 20px rgba(46,204,113,0.4); }
  p.hint { margin-top: 18px; font-size: 0.85rem; opacity: 0.5; }
</style>
</head>
<body>
  <div id="tapzone">
    <div class="card">
      <div class="icon">🔔</div>
      <h1>Tag 1 &mdash; Doorbell Sound</h1>
      <div class="pill" id="pill">▶ Tap Anywhere</div>
      <p class="hint">This page was opened by an NFC tag tap</p>
    </div>
  </div>

  <audio id="audio" src="sounds/doorbell.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const pill = document.getElementById('pill');
    const zone = document.getElementById('tapzone');

    function showPlaying() {
      pill.textContent = '🔊 Playing...';
      pill.classList.add('played');
      setTimeout(() => {
        pill.textContent = '▶ Tap Anywhere';
        pill.classList.remove('played');
      }, 1200);
    }

    let started = false;

    function playSound() {
      if (started) return;
      audio.currentTime = 0;
      audio.play().then(() => {
        started = true;
        showPlaying();
      }).catch(() => {
        // Still blocked — a later event will retry.
      });
    }

    // Attempt #1: fire the instant the script runs.
    playSound();

    // Attempt #2: retry whenever the page becomes visible/focused again —
    // this covers the case where Android's "Open link found by NFC?"
    // dialog was showing first and the page only becomes active after
    // the user dismisses it, and also covers switching back from another
    // app or the app-switcher.
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') playSound();
    });
    window.addEventListener('pageshow', playSound);
    window.addEventListener('focus', playSound);

    // Attempt #3: catch the very first user interaction anywhere on the
    // page, as early in the event chain as possible (capture phase, on
    // the document rather than a single element) so any tap, touch, or
    // key press counts — not just a tap squarely on the tapzone.
    ['pointerdown', 'touchstart', 'mousedown', 'keydown', 'click'].forEach(evt => {
      document.addEventListener(evt, playSound, { capture: true, passive: true });
    });

    // Visual press feedback on the tap zone (cosmetic only).
    zone.addEventListener('pointerdown', () => zone.classList.add('pressed'));
    zone.addEventListener('pointerup', () => zone.classList.remove('pressed'));
    zone.addEventListener('pointercancel', () => zone.classList.remove('pressed'));

    // Manual tap on the zone always works too, and allows replaying
    // after the first automatic play has already happened.
    zone.addEventListener('pointerup', () => {
      if (started) {
        audio.currentTime = 0;
        audio.play();
        showPlaying();
      }
    });
  </script>
</body>
</html>
