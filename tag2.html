<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Alarm Tag</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    height: 100%; margin: 0;
    display: flex; align-items: center; justify-content: center;
    background: #10131a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  .card {
    text-align: center;
    padding: 40px 32px;
    color: #f4f4f4;
  }
  .icon { font-size: 64px; margin-bottom: 8px; }
  h1 { font-size: 1.3rem; font-weight: 600; margin: 0 0 24px; opacity: 0.9; }
  button {
    font-size: 1.3rem;
    font-weight: 600;
    padding: 22px 48px;
    border: none;
    border-radius: 999px;
    background: #ff7a45;
    color: white;
    cursor: pointer;
    box-shadow: 0 6px 20px rgba(255,122,69,0.4);
    transition: transform 0.15s ease, background 0.15s ease;
  }
  button:active { transform: scale(0.96); background: #e05f2b; }
  button.played { background: #2ecc71; box-shadow: 0 6px 20px rgba(46,204,113,0.4); }
  p.hint { margin-top: 18px; font-size: 0.85rem; opacity: 0.5; }
</style>
</head>
<body>
  <div class="card">
    <div class="icon">⏰</div>
    <h1>Tag 2 &mdash; Alarm Sound</h1>
    <button id="playBtn" onclick="playSound()">▶ Tap to Play</button>
    <p class="hint">This page was opened by an NFC tag tap</p>
  </div>

  <audio id="audio" src="sounds/alarm.mp3" preload="auto"></audio>

  <script>
    const audio = document.getElementById('audio');
    const btn = document.getElementById('playBtn');

    // Try to autoplay immediately (works on some browsers when
    // navigation itself counts as a user gesture, e.g. many Android
    // NFC-to-browser flows). If blocked, the button click will handle it.
    audio.play().then(() => {
      btn.textContent = '🔊 Playing...';
    }).catch(() => {
      // Autoplay blocked — user needs to tap the button once.
    });

    function playSound() {
      audio.currentTime = 0;
      audio.play();
      btn.textContent = '🔊 Playing...';
      btn.classList.add('played');
      setTimeout(() => {
        btn.textContent = '▶ Play Again';
        btn.classList.remove('played');
      }, 1200);
    }
  </script>
</body>
</html>
