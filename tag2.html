<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>&#9834;</title>
<style>
  :root { color-scheme: light dark; }
  html, body {
    height: 100%; margin: 0;
    background: #10131a;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-tap-highlight-color: transparent;
    overscroll-behavior: none;
    touch-action: manipulation;
    overflow: hidden;
  }
  #tapzone {
    position: relative;
    height: 100%; width: 100%;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer;
    user-select: none;
  }

  .btn {
    width: 110px; height: 110px;
    border-radius: 50%;
    background: #ff7a45;
    display: flex; align-items: center; justify-content: center;
    color: white;
    box-shadow: 0 8px 28px rgba(255,122,69,0.4);
    transition: transform 0.15s ease, opacity 0.3s ease, box-shadow 0.15s ease;
  }
  .btn svg { width: 42px; height: 42px; }
  #tapzone.pressed .btn { transform: scale(0.92); }
  .btn.hidden { opacity: 0; transform: scale(0.7); pointer-events: none; }

  .reveal {
    position: absolute;
    display: flex; flex-direction: column; align-items: center;
    opacity: 0; transform: translateY(10px) scale(0.97);
    transition: opacity 0.45s ease, transform 0.45s ease;
    pointer-events: none;
  }
  .reveal.visible { opacity: 1; transform: translateY(0) scale(1); }
  .reveal img { width: min(80vw, 440px); height: auto; }
  .reveal p {
    margin: 14px 0 0;
    font-size: 1.5rem;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: #f4f4f4;
  }
</style>
</head>
<body>
  <div id="tapzone">
    <div class="btn" id="btn">
      <svg id="icon-play" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
      <svg id="icon-eye" viewBox="0 0 24 24" fill="currentColor" style="display:none"><path d="M12 5c-5.6 0-9.6 4.4-11 7 1.4 2.6 5.4 7 11 7s9.6-4.4 11-7c-1.4-2.6-5.4-7-11-7zm0 11.5A4.5 4.5 0 1 1 12 7.5a4.5 4.5 0 0 1 0 9zm0-2A2.5 2.5 0 1 0 12 9.5a2.5 2.5 0 0 0 0 5z"/></svg>
    </div>
    <div class="reveal" id="reveal">
      <img src="images/tag2.svg" alt="SOL - FA - RE - SI on a musical staff">
      <p>SOL &middot; FA &middot; RE &middot; SI</p>
    </div>
  </div>

  <audio id="audio" src="sounds/tag2.mp3" preload="auto"></audio>
  <!-- tag2.mp3 contains the piano notes SOL-FA-RE-SI (G4-F4-D4-B3) descending -->

  <script>
    const audio = document.getElementById('audio');
    const zone = document.getElementById('tapzone');
    const btn = document.getElementById('btn');
    const iconPlay = document.getElementById('icon-play');
    const iconEye = document.getElementById('icon-eye');
    const reveal = document.getElementById('reveal');

    // stage 0 = not played yet (blind), 1 = played (waiting for reveal tap), 2 = revealed
    let stage = 0;

    function markPlayed() {
      if (stage !== 0) return;
      stage = 1;
      iconPlay.style.display = 'none';
      iconEye.style.display = '';
    }

    // Silent auto-play attempts: only ever advance stage 0 -> 1, never
    // trigger the reveal. These fire on page load and whenever the page
    // regains visibility/focus (e.g. after Android's NFC confirmation
    // dialog is dismissed) — no explicit tap required if the browser
    // allows it.
    function attemptAutoPlay() {
      if (stage !== 0) return;
      audio.play().then(markPlayed).catch(() => {});
    }
    attemptAutoPlay();
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') attemptAutoPlay();
    });
    window.addEventListener('pageshow', attemptAutoPlay);
    window.addEventListener('focus', attemptAutoPlay);

    // A real, deliberate tap on the page drives the stage machine:
    // stage 0 -> play the sound (blind); stage 1 -> reveal; stage 2+ -> replay.
    function handleTap() {
      if (stage === 0) {
        audio.currentTime = 0;
        audio.play().then(markPlayed).catch(() => {});
      } else if (stage === 1) {
        stage = 2;
        btn.classList.add('hidden');
        reveal.classList.add('visible');
      } else {
        audio.currentTime = 0;
        audio.play();
      }
    }

    zone.addEventListener('pointerdown', () => zone.classList.add('pressed'));
    zone.addEventListener('pointerup', () => zone.classList.remove('pressed'));
    zone.addEventListener('pointercancel', () => zone.classList.remove('pressed'));
    // Only one gesture type triggers the stage machine, so a single
    // physical tap can't accidentally fire twice (e.g. pointerup + click).
    zone.addEventListener('click', handleTap);
  </script>
</body>
</html>
